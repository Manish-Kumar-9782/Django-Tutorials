{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>News</title>

    <style>
        .news-container {
            width: 500px;
            border: 1px solid rgb(128, 128, 128);
            padding: 20px;
            font-size: 17px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif
        }

        .news-img {
            width: 100%;
        }
    </style>

</head>

<body>

    <div class="news-container">
        <h1>{{news.title}}</h1>

        <img class="news-img"
             src="{% static 'images/img1.jpg' %}"
             alt="alo vera">

        {% for para in news.paras %}
        <p>{{para}}</p>
        {% endfor %}

    </div>
</body>

</html>
