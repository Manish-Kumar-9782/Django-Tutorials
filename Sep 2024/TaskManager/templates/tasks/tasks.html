<div class="task-list-container">
    {% for taskList in taskLists %}
    <div class="task-list-card card-theme"
         style="--color:{{color_range|random}}">

        <header class="tasklist-header">
            <div class="d-flex al-center jc-between">
                <h1 class="task-list-title">{{taskList.title}}</h1>
                <form action="{% url 'delete_taskList' taskList.id %}"
                      method="POST">
                    {% csrf_token %}
                    <!-- <input class="task-delete-button"
                           type="submit"
                           value="X"> -->

                    <button type="submit"
                            class="task-delete-button">X</button>

                </form>
            </div>

            <div class="d-flex gap-1">
                <span class="task-list-category badge">{{taskList.category}}</span>
                <span
                      class="task-list-category badge status-{{taskList.status}} ">{{taskList.status}}</span>
                <span
                      class="task-list-category badge priority-{{taskList.priority}}">{{taskList.priority}}</span>
            </div>
        </header>


        <div class="task-actions-body">
            <!-- a form to update task list items -->
            <form action="{% url 'update_taskList_tasks' %}"
                  method="POST"
                  id="update-tasklist-form-{{taskList.id}}">
                {% csrf_token %}
                <input type="text"
                       name="taskListId"
                       value="{{taskList.id}}"
                       hidden>
                <ul id="task-list-{{taskList.id}}"
                    class="task-list">
                    {% for task in taskList.tasks.all %}
                    <li class="task-list-item">

                        <div>
                            <input class="task-list-item-checkbox"
                                   type="checkbox"
                                   name="task-{{task.id}}"
                                   id="task-{{task.id}}"
                                   {% if task.isCompleted %}
                                   checked
                                   {% endif %}>

                            <span class="task-list-item-title">
                                {{task}}
                            </span>
                        </div>

                        <div class="list-item-actions">
                            <a href="{% url 'update_task' task.id %}"> <i
                                   class="bi bi-pencil"></i></a>
                            <a href="{% url 'delete_task' task.id %}"><i class="bi bi-x-lg"></i></a>
                        </div>
                    </li>
                    {% endfor %}
                </ul>



            </form>

            <!-- a form to update a task into the current task list -->
            <form id="add-update-task"
                  class="d-flex gap-1"
                  action="{% if update.taskListId == taskList.id %}
  {% url 'update_task' update.task.id %}
  {% else %}
  {% url 'add_task' taskList.id %}
  {% endif %}"
                  method="POST">
                {% csrf_token %}
                <input id="{{taskList.id}}"
                       class="add-task-input"
                       type="text"
                       name="text"
                       value="{% if update.taskListId == taskList.id %}{{update.task.text}}{% endif %}">

                <button class="update-tasklist-button"
                        type="submit"
                        form="update-tasklist-form-{{taskList.id}}">
                    <i class="bi bi-floppy2"></i>
                </button>
            </form>

        </div>

    </div>

    {% endfor %}

    <script>

        const inputs = document.getElementsByClassName("add-task-input")

        function onInputEnter(e) {

            if (e.key == "Enter") {
                e.preventDefault()
                const data = {
                    text: this.value,
                    taskList: this.id
                };
                console.log(data)
                fetchData(data)
            }
        }

        for (let i = 0; i < inputs.length; i++) {
            inputs[i].onkeypress = onInputEnter
        }


        function on_result_add_task(result) {

            if (result) {
                data = result.data
                console.log(data)
                const ul = document.getElementById(`task-list-${data.taskListId}`)
                const li = document.createElement('li')
                li.textContent = data.text
                ul.appendChild(li)

            }

        }


        // Async function define karna
        async function fetchData(data) {
            const csrftoken = document.getElementsByName("csrfmiddlewaretoken")[0].value

            try {
                // Fetch request bhejna
                const response = await fetch('api/add_task', {
                    method: 'POST', // HTTP method
                    headers: {
                        'Content-Type': 'application/json', // Data ka type
                        'X-CSRFToken': csrftoken // CSRF token
                    },
                    body: JSON.stringify(data) // Data ko JSON format mein convert karna
                });

                // Response ko check karna
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const result = await response.json(); // Response ko JSON format mein convert karna
                console.log('Success:', result); // Success message

                on_result_add_task(result);


            } catch (error) {
                console.error('Error:', error); // Error handling
            }
        }

    </script>
</div>
