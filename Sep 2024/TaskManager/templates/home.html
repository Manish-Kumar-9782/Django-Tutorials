{% extends "index.html" %}
{% load static %}


{% block content %}


<div class="content">
    <!-- content header -->
    <div class="d-flex jc-between al-center ">

        <div class="search-input-box">
            <i class="bi bi-search search-logo"></i>
            <input class="search-input"
                   type="search"
                   name="task_list"
                   id="task_list">
        </div>
        <div class="d-flex  al-center gap-1">

            <i class="bi bi-bell-fill"></i>
            <span class="user-info">
                <span class="user-name">Ram Lal Parsad</span> <br>
                <span class="user-role">HR Manager</span>
            </span>

            <img class="user-avatar"
                 src="{% static 'images/user 1.png' %}"
                 alt="user avatar">

        </div>

    </div>

    <div class="d-flex jc-between al-center mt-4">
        <h1 class="text-2xl">Tasks Management</h1>
        <button class="add-tasklist-button">
            <a href="{% url 'add_taskList' %}">
                <i class="bi bi-node-plus add-tasklist-icon"></i>
                <span>Add Task</span>
            </a>
        </button>
    </div>


    <div class="pt-5">
        {% include "tasklist/tasklist-main.html" %}
    </div>

</div>

{% endblock content %}
