<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Blog Entry</title>
    <style>
        label {
            vertical-align: top;

        }
    </style>
</head>

<body>

    <h1>Add a Blog Entry</h1>

    <form action=""
          method="post">
        {% csrf_token %}
        <label for="title">Blog Title</label>
        <input id="title"
               type="text"
               name="title">

        <br> <br>

        <label for="paragraphs">Blog Paragraphs</label>
        <textarea name="paragraphs"
                  id="paragraphs"
                  cols="70"
                  rows="15"></textarea>

        <br>
        <input type="submit">


    </form>


</body>

</html>
